services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://quiz:quiz@tt-postgres:5432/quiz
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - tt-network
    restart: unless-stopped

networks:
  tt-network:
    external: true
    name: tt-backend_tt-net
